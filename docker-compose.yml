services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      # Read from .env (gitignored). Only the API gets it; the worker never needs it.
      # Compose refuses to start if it's unset.
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is not set - copy .env.example to .env and generate one}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
    depends_on:
      - redis
    volumes:
      # Shared volume so the API can pass uploaded files to the worker
      - shared_tmp:/app/tmp
      # Mount the backend for hot-reloading. Run `npm run build` in frontend/
      # to refresh backend/static/dist, which this mount then serves.
      - ./backend:/app

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      # Shared volume so the worker can access files uploaded to the API
      - shared_tmp:/app/tmp
      # Persist PaddleOCR models
      - ./paddleocr_models:/root/.paddleocr
    dns:
      - 8.8.8.8
      - 8.8.4.4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  celery-beat:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command: celery -A app.worker beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - shared_tmp:/app/tmp

volumes:
  shared_tmp:
